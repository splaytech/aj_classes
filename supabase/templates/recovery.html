<!doctype html>
<!-- AJ Classes staff email (R2a design §9.2). Colours copied from apps/web/src/styles/theme.css. -->
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f9ff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        'Segoe UI',
        sans-serif;
      color: #172033;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td
          style="
            padding: 24px 32px;
            background: #172554;
            border-radius: 16px 16px 0 0;
            color: #ffffff;
            font-size: 20px;
          "
        >
          <strong>AJ</strong> Classes
          <span style="color: #f9c62b; font-size: 14px">&nbsp;Staff</span>
        </td>
      </tr>
      <tr>
        <td style="padding: 32px; font-size: 16px; line-height: 1.6">
          <h1 style="margin: 0 0 16px; font-size: 22px; color: #172554">Reset your password</h1>
          <p style="margin: 0">
            Someone asked to reset the password for this AJ Classes staff account. Click the button
            to choose a new one.
          </p>
          <p style="margin: 24px 0">
            <a
              href="{{ .SiteURL }}/portal/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
              style="
                display: inline-block;
                padding: 12px 24px;
                background: #2563eb;
                color: #ffffff;
                border-radius: 8px;
                font-weight: 700;
                text-decoration: none;
              "
              >Choose a new password</a
            >
          </p>
          <p style="margin: 0; color: #4b5563; font-size: 14px">
            This link expires in 1 hour and works once.
          </p>
          <p style="margin: 24px 0 0; color: #4b5563; font-size: 14px">
            If you didn't expect this email, you can ignore it.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
