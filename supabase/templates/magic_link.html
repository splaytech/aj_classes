<!doctype html>
<!-- AJ Classes staff email (R2a design §9.2). Colours copied from apps/web/src/styles/theme.css. -->
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f9ff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        'Segoe UI',
        sans-serif;
      color: #172033;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td
          style="
            padding: 24px 32px;
            background: #172554;
            border-radius: 16px 16px 0 0;
            color: #ffffff;
            font-size: 20px;
          "
        >
          <strong>AJ</strong> Classes
          <span style="color: #f9c62b; font-size: 14px">&nbsp;Staff</span>
        </td>
      </tr>
      <tr>
        <td style="padding: 32px; font-size: 16px; line-height: 1.6">
          <h1 style="margin: 0 0 16px; font-size: 22px; color: #172554">
            Signing in to AJ Classes
          </h1>
          <!-- Staff never sign in with email links (R2a): no token in this email on purpose. -->
          <p style="margin: 0">
            The AJ Classes staff portal doesn't use email sign-in links. Please sign in with your
            email and password at
            <a href="{{ .SiteURL }}/portal/login" style="color: #2563eb"
              >{{ .SiteURL }}/portal/login</a
            >.
          </p>
          <p style="margin: 24px 0 0; color: #4b5563; font-size: 14px">
            If you didn't expect this email, you can ignore it.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
